<html lang="th">
<head>

<title>แผงทดลองวงจรไฟฟ้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f3f5f8; --line:#d6dbe3; --text:#1c2230; --muted:#667085;
  --vlab:#b45309; --ilab:#2563eb; --plab:#be185d;
  --hkw:#7c3aed; --hty:#0369a1; --hfn:#0f766e; --hct:#c2410c; --hstr:#15803d; --hnum:#b45309; --hcom:#8a94a3; --hpp:#a21caf; --hobj:#1d4ed8; --hbad:#dc2626; --hwarn:#d97706;
  --accent:#2563eb; --accent-text:#ffffff; --board:#fafbfc; --grid:#c9d0da;
  --comp:#1f2937; --compfill:#ffffff; --wire:#7b8494; --sel:#7c3aed;
  --l1:#8b5a2b; --l2:#111827; --l3:#8a93a3; --nwire:#2f6fd6; --dcp:#dc2626; --dcn:#1f2937;
  --flow:#f59e0b; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2;
  --lamp:#fbbf24; --water:#3b82f6; --waterbg:#dbeafe; --screen:#0f172a; --screentext:#e2e8f0;
  --ladon:#16a34a; --ladoff:#94a3b8; --sky1:#b9cde4; --sky2:#e9eef4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --panel:#171b23; --panel2:#1f2430; --line:#2c3341; --text:#e5e9f0; --muted:#98a2b3;
    --vlab:#fbbf24; --ilab:#60a5fa; --plab:#f472b6; --hkw:#c4b5fd; --hty:#7dd3fc; --hfn:#5eead4; --hct:#fdba74; --hstr:#86efac; --hnum:#fcd34d; --hcom:#6b7685; --hpp:#f0abfc; --hobj:#93c5fd; --hbad:#f87171; --hwarn:#fbbf24; --accent:#60a5fa; --accent-text:#0b1220; --board:#12161d; --grid:#2a313d;
    --comp:#d6dbe4; --compfill:#1b2029; --wire:#6b7484; --sel:#a78bfa;
    --l1:#c08850; --l2:#d1d5db; --l3:#7d8696; --nwire:#5b9bff; --dcp:#f87171; --dcn:#cbd5e1;
    --flow:#fbbf24; --ok:#4ade80; --okbg:#14321f; --warn:#fbbf24; --warnbg:#3a2c0b; --bad:#f87171; --badbg:#3b1414;
    --lamp:#fcd34d; --water:#60a5fa; --waterbg:#172a46; --screen:#05080e; --screentext:#e2e8f0;
    --ladon:#4ade80; --ladoff:#64748b; --sky1:#080b11; --sky2:#1a202b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#171b23; --panel2:#1f2430; --line:#2c3341; --text:#e5e9f0; --muted:#98a2b3;
  --vlab:#fbbf24; --ilab:#60a5fa; --plab:#f472b6; --hkw:#c4b5fd; --hty:#7dd3fc; --hfn:#5eead4; --hct:#fdba74; --hstr:#86efac; --hnum:#fcd34d; --hcom:#6b7685; --hpp:#f0abfc; --hobj:#93c5fd; --hbad:#f87171; --hwarn:#fbbf24; --accent:#60a5fa; --accent-text:#0b1220; --board:#12161d; --grid:#2a313d;
  --comp:#d6dbe4; --compfill:#1b2029; --wire:#6b7484; --sel:#a78bfa;
  --l1:#c08850; --l2:#d1d5db; --l3:#7d8696; --nwire:#5b9bff; --dcp:#f87171; --dcn:#cbd5e1;
  --flow:#fbbf24; --ok:#4ade80; --okbg:#14321f; --warn:#fbbf24; --warnbg:#3a2c0b; --bad:#f87171; --badbg:#3b1414;
  --lamp:#fcd34d; --water:#60a5fa; --waterbg:#172a46; --screen:#05080e; --screentext:#e2e8f0;
  --ladon:#4ade80; --ladoff:#64748b; --sky1:#080b11; --sky2:#1a202b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 'IBM Plex Sans Thai',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 10px 0 2px;font-weight:600;white-space:nowrap}
header .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.run{min-width:84px;font-weight:600;background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.btn.run.stopped{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
select,input[type=number],input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#main{flex:1;display:grid;grid-template-columns:184px minmax(0,1fr) 300px;min-height:0}
#pal{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:6px 8px 16px}
#pal h3{font-size:12px;color:var(--muted);margin:10px 2px 4px;font-weight:600}
.pi{display:flex;gap:6px;align-items:center;width:100%;text-align:left;margin:1px 0;padding:3px 8px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer}
.pi:hover{background:var(--panel2);border-color:var(--line)}
.pi.on{background:var(--accent);color:var(--accent-text)}
#psearch{width:100%;margin:2px 0 4px}
#pal details>summary{list-style:none;cursor:pointer}
#pal details>summary::-webkit-details-marker{display:none}
#pal details>summary::after{content:'▸';margin-left:auto;color:var(--muted);font-size:11px}
#pal details[open]>summary::after{content:'▾'}
.pi .cnt{font-size:10.5px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:0 6px;margin-left:4px}
.pi.sub{padding-left:28px;font-size:12.5px;color:var(--muted)}
.pi.sub.on{color:var(--accent-text)}
.rd.spec td{color:var(--muted)}
.fld.wide{grid-template-columns:1fr;gap:2px}
.pi i{font-style:normal;width:18px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.8}
#center{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#views{flex:1;display:flex;min-height:0;min-width:0}
#cv{flex:1 1 0;display:block;min-width:0;min-height:0;height:100%;touch-action:none;background:var(--board);cursor:default}
#fwrap{display:none;position:relative;flex:1 1 0;min-width:0;min-height:0;border-left:1px solid var(--line);overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 62%)}
#views.split #fwrap,#views.full #fwrap{display:block}
#views.full #cv{display:none}
#views.full + #hint{display:none}
#fx{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#fhud{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px)}
#fzoom{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:2}
#fzoom .btn{width:40px;height:40px;padding:0;font-size:20px;font-weight:600;background:color-mix(in srgb,var(--panel) 85%,transparent);box-shadow:0 2px 8px rgba(0,0,0,.2)}
@media (max-width:600px){#fhud .fcard{font-size:12px;padding:6px 8px}#fhud .btn{min-height:32px;padding:2px 10px;font-size:13px}#fhud .sub{display:none}#views.split #fwrap{flex:0 0 42%}}
.fcard{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.fcard .row{margin:6px 0 4px}
.fcard .fhmin{float:right;margin:-2px -2px 0 6px;padding:0 8px;min-height:26px}
#fhud .fcard.min{display:flex;align-items:center;gap:6px;padding:4px 6px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--panel) 78%,transparent)}
#fhud .fcard.min::-webkit-scrollbar{display:none}
#fhud .fcard.min .fhmin{float:none;order:9;margin:0;flex:none}
#fhud .fcard.min>b{flex:none;font-size:12px}
#fhud .fcard.min .row{display:flex;flex-wrap:nowrap;gap:4px;margin:0;flex:none}
#fhud .fcard.min .row .btn:not([data-press]),#fhud .fcard.min .sub,#fhud .fcard.min #fcnt,#fhud .fcard.min #fstat,#fhud .fcard.min .row:not(:first-of-type){display:none}
#fhud .fcard.min .btn{min-height:30px;padding:2px 10px;flex:none}
#fhud .fcard.min .e{font-size:11px;flex:none;white-space:nowrap}
.fcard .e{color:var(--bad);font-size:12px}
.fcard select{max-width:190px}
.fprop{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;display:grid;gap:3px;max-width:330px}
.fprop label{display:grid;grid-template-columns:1fr 130px;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.fprop input,.fprop select{width:100%}
.fcard .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
#flab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#flab span{position:absolute;transform:translate(-50%,-50%);font:600 11px 'IBM Plex Mono',monospace;color:var(--text);background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
#hint{position:absolute;left:10px;top:8px;font-size:12px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--board) 85%,transparent);padding:2px 6px;border-radius:4px}
#scopewin{position:absolute;right:10px;top:10px;width:min(720px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:6;display:flex;flex-direction:column;max-height:calc(100% - 20px);overflow:auto}
#scopewin[hidden]{display:none}
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:4px;display:flex;flex-direction:column;min-width:230px}
.pop[hidden]{display:none}
.pop button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit;color:inherit}
.pop button:hover{background:var(--panel2)}
.pop label{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--panel2)}
.pop .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal .mbody{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:min(560px,100%);max-height:90vh;overflow:auto}
#modal h3{margin:0 0 6px;font-size:16px}
#modal textarea{width:100%;font:12px 'IBM Plex Mono',monospace;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;background:var(--text);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
#toast[hidden]{display:none}
#task{position:absolute;left:10px;top:34px;z-index:6;width:min(430px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13.5px;max-height:calc(100% - 50px);overflow:auto}
#task[hidden]{display:none}
#task p{margin:8px 10px}
#task .row,#task .tag,#task .anhint{margin-left:10px;margin-right:10px}
#task .anhint{padding-bottom:8px}
.exlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.exlist .btn{text-align:left;padding:8px 12px}
@media (max-width:600px){#task{top:auto;bottom:calc(64px + env(safe-area-inset-bottom));left:8px;right:8px;width:auto;max-height:45%}}
#anwin{position:absolute;left:10px;top:10px;width:min(1000px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:7;display:flex;flex-direction:column;max-height:calc(100% - 20px);overflow:auto}
#anwin[hidden]{display:none}
#anwin .swc input,#anwin .swc select{width:100%}
.anbody{display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px;padding:0 10px 6px}
.anprobe{display:flex;flex-direction:column;gap:4px;min-width:0}
.anlist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px;font:11.5px 'IBM Plex Mono',monospace}
.anlist label{display:flex;gap:5px;align-items:center;padding:1px 2px;white-space:nowrap;cursor:pointer}
.anhint{font-size:11px;color:var(--muted)}
.anplot{min-width:0}
#anv{width:100%;height:340px;display:block;border:1px solid var(--line);border-radius:6px;touch-action:none}
#anmeas{display:flex;flex-direction:column;gap:3px;padding-top:6px;font:11.5px 'IBM Plex Mono',monospace}
#anmeas .mr{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px dashed var(--line)}
.antb{border-collapse:collapse;width:100%;font:11.5px 'IBM Plex Mono',monospace;margin:4px 0}
.antb th,.antb td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.antb th{color:var(--muted);font-weight:600}
#antab{max-height:380px;overflow:auto}
#anmsg{font-size:12px;padding:4px 10px 8px;color:var(--muted)}
#anmsg .e{color:var(--bad)}
#annet textarea{width:calc(100% - 20px);margin:0 10px 10px;height:220px;font:11.5px 'IBM Plex Mono',monospace;resize:vertical}
@media (max-width:820px){.anbody{grid-template-columns:1fr}.anlist{max-height:140px}#anv{height:260px}}
.swh{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:move;flex-wrap:wrap}
#scv{width:100%;height:300px;display:block;flex:none;touch-action:none}
#trwin{position:absolute;left:10px;bottom:10px;width:min(760px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:6;display:flex;flex-direction:column;max-height:calc(100% - 20px);overflow:auto}
#trwin[hidden],#exwin[hidden],#rpt[hidden],#acpop[hidden]{display:none}
#acpop{position:absolute;z-index:20;min-width:300px;max-width:min(460px,92vw);max-height:270px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.3);font-size:12.5px;padding:3px}
#acpop .it{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:5px 8px;border-radius:6px;cursor:pointer;align-items:baseline}
#acpop .it.on{background:color-mix(in srgb,var(--accent) 16%,transparent)}
#acpop .it code{font:600 12.5px 'IBM Plex Mono',monospace;color:var(--text)}#acpop .it code u{text-decoration:none;color:var(--accent)}
#acpop .k{font:600 10px 'IBM Plex Mono',monospace;color:var(--accent-text);background:var(--accent);border-radius:4px;padding:1px 5px;justify-self:end}
#acpop .k.v{background:var(--ok)}#acpop .k.c{background:var(--muted)}#acpop .k.m{background:#9333ea}#acpop .k.s{background:var(--warn)}
#acpop .d{grid-column:1/3;color:var(--muted);font-size:11.5px}#acpop .sg{grid-column:1/3;font:11px 'IBM Plex Mono',monospace;color:var(--muted)}
#acpop .ft{padding:4px 8px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:2px}
#exwin{position:absolute;right:10px;top:10px;width:min(860px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:8;display:flex;flex-direction:column;max-height:calc(100% - 20px);overflow:auto}
#exwin textarea{width:100%;font:12px 'IBM Plex Mono',monospace;resize:vertical}
#exv{width:100%;height:260px;display:block;flex:none}
#extab{padding:0 10px 10px;overflow-x:auto}#extab table{border-collapse:collapse;width:100%;font:12px 'IBM Plex Mono',monospace}
#extab th,#extab td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right;white-space:nowrap}#extab th{color:var(--muted);font-weight:600}
#rpt{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;flex-direction:column;padding:16px}
#rpt .rbar{display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:10px 10px 0 0;padding:8px 10px;flex-wrap:wrap}
#rpt iframe{flex:1;border:0;background:#fff;border-radius:0 0 10px 10px;width:100%}
#trv{width:100%;height:240px;display:block;flex:none}
.trsig{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 10px;padding:8px 10px;font-size:12.5px}
.trsig div{display:flex;align-items:center;gap:6px}.trsig input{flex:1;min-width:0;font:12px 'IBM Plex Mono',monospace}
.trsig i{width:12px;height:12px;border-radius:3px;flex:none}.trsig b{font:600 12px 'IBM Plex Mono',monospace;min-width:70px;text-align:right}
.swc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px;padding:8px 10px;font-size:12.5px}
.swc label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
#scmeas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 18px;padding:0 10px 10px;font:12px 'IBM Plex Mono',monospace}
#scmeas .mr{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line)}
@media (max-width:820px){.swc{grid-template-columns:repeat(2,minmax(0,1fr))} #scv{height:220px}}
#lad{height:0;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;transition:height .15s}
#lad.open{height:46%}
.ladbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line)}
.ladbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ladbar input{width:70px}
#ladbody{flex:1;overflow:auto;padding:6px 10px}
#ladbody textarea{width:100%;height:calc(100% - 4px);min-height:120px;font-family:'IBM Plex Mono',monospace;font-size:13px;resize:none}
#ladmsg{font-size:12px;padding:3px 10px;border-top:1px solid var(--line);min-height:22px;color:var(--muted)}
#ladmsg .e{color:var(--bad)}
.rung{margin:2px 0 8px}
#ladbody.mcu{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:8px;overflow:hidden}
#ladbody.mcu textarea{height:100%}
.cedit{position:relative;display:flex;min-height:0;height:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.cgut{flex:none;min-width:38px;overflow:hidden;background:var(--panel2);color:var(--muted);font:13px/1.5 'IBM Plex Mono',monospace;text-align:right;padding:6px 6px 6px 14px;user-select:none;cursor:pointer}
.cgut div{position:relative}.cgut div.e::before,.cgut div.w::before{content:'';position:absolute;left:-10px;top:calc(.75em - 4px);width:8px;height:8px;border-radius:50%;background:var(--hbad)}.cgut div.w::before{background:var(--hwarn)}
.cgut div.e,.cgut div.w{color:var(--text);font-weight:600}
.cwrap{position:relative;flex:1;min-width:0}
#ladbody .cwrap pre,#ladbody .cwrap textarea{position:absolute;inset:0;margin:0;padding:6px 8px;font:13px/1.5 'IBM Plex Mono',monospace;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;border:0;border-radius:0;letter-spacing:0;box-sizing:border-box;width:100%;height:100%;min-height:0}
#ladbody .cwrap pre{overflow:hidden;color:var(--text);pointer-events:none}
#ladbody .cwrap textarea{background:transparent;color:transparent;caret-color:var(--text);resize:none;outline:none;overflow:auto;-webkit-text-fill-color:transparent}

<header>

<script>
'use strict';
/* ============================================================
   1. ค่าคงที่และชนิดอุปกรณ์
   ============================================================ */
const G = 40;            // 1 ช่องกริด = 40 px
const GW = 1e3;          // สายไฟ / หน้าสัมผัสปิด = 1 mΩ
const GMIN = 1e-9;       // ทุกโหนดลงกราวด์
const GOFF = 1e-9;       // หน้าสัมผัสเปิด
const LC = 7;            // จำนวนช่องต่อแถวในแลดเดอร์
const SQ3 = Math.sqrt(3);

const PLC_PINS = [[-5,-2,'L+'],[-4,-2,'M'],[-3,-2,'COM'],[-2,-2,'I0'],[-1,-2,'I1'],[0,-2,'I2'],[1,-2,'I3'],[2,-2,'I4'],[3,-2,'I5'],[4,-2,'I6'],[5,-2,'I7'],
  [-5,2,'C'],[-4,2,'Q0'],[-3,2,'Q1'],[-2,2,'Q2'],[-1,2,'Q3'],[3,2,'A'],[4,2,'B'],[0,2,'AI0'],[1,2,'AI1'],[2,2,'AM'],[5,2,'A2'],[6,2,'B2'],[6,-2,'ETH'],[7,2,'AQ0']];

/* อุปกรณ์ 2 ขั้ว: ไม่มี pins, หมุนได้ด้วย r (0–3), ครึ่งความยาว L
   บล็อก: มี pins [dx,dy,ชื่อ] และ box [x0,y0,x1,y1] (หน่วยช่อง), หมุนไม่ได้ */
/* บอร์ดไมโครคอนโทรลเลอร์: ขาแถวบน (dy=-2) และแถวล่าง (dy=+2), null = ช่องว่าง
   role ของขา: ตัวเลข = GPIO, 'G' = GND, 'V5' = 5V, 'V33' = 3V3 */
function mkBoard(o){
  const pins = [], map = {}, role = [];
  o.top.forEach((l, i) => { if (l) pins.push([o.x0 + i, -2, l]); });
  o.bot.forEach((l, i) => { if (l) pins.push([o.x0 + i, 2, l]); });
  pins.forEach((pn, k) => {
    const l = pn[2]; let r;
    if (l === 'GND') r = 'G'; else if (l === '5V') r = 'V5'; else if (l === '3V3') r = 'V33';
    else if (l[0] === 'A') r = o.a0 + +l.slice(1);
    else r = +/^(?:D|GP|G)?(\d+)$/.exec(l)[1];
    role.push(r); if (typeof r === 'number') map[r] = k;
  });
  const w = Math.max(o.top.length, o.bot.length);
  return Object.assign(o, {pins, map, role, box:[o.x0 - 0.6, -2, o.x0 + w - 1 + 0.6, 2]});
}

function pinsOf(c){

let S = {comps:[], wires:[], nid:1};

// จุดที่จะแยกสาย (ต่อเข้ากลางสาย) ในการ commit ครั้งถัดไป: เฉพาะปลายของสายที่เพิ่งลาก และขั้วของอุปกรณ์ที่เพิ่งวาง/ย้าย/หมุน
// สายที่ลากผ่านมุม/ปลายสาย/ขั้วอื่นกลางเส้นจึงไม่ต่อกัน · full = แยกทุกจุด (ตัวอย่างที่สร้างด้วย build)
let splitPts = [];
const markSplit = pts => { for (const p of pts) splitPts.push([p[0], p[1]]); };
function normalize(full){
  const P = new Set(), k = (x,y) => x + ',' + y;
  if (full){
    for (const w of S.wires){ P.add(k(w.x1,w.y1)); P.add(k(w.x2,w.y2)); }
    for (const c of S.comps) for (const p of pinsOf(c)) P.add(k(p[0],p[1]));
  } else for (const p of splitPts) P.add(k(p[0], p[1]));
  splitPts = [];
  const out = [], seen = new Set();
  const push = (x1,y1,x2,y2) => {
    if (x1 === x2 && y1 === y2) return;
    if (x2 < x1 || (x2 === x1 && y2 < y1)) [x1,y1,x2,y2] = [x2,y2,x1,y1];
    const kk = x1+','+y1+','+x2+','+y2;
    if (seen.has(kk)) return;
    seen.add(kk); out.push({x1,y1,x2,y2});
  };
  for (const w of S.wires){
    const ax = Math.abs(w.x2-w.x1), ay = Math.abs(w.y2-w.y1);
    if (ax && ay && ax !== ay){ push(w.x1,w.y1,w.x2,w.y2); continue; }
    const dx = Math.sign(w.x2-w.x1), dy = Math.sign(w.y2-w.y1), n = Math.max(ax,ay);
    let sx = w.x1, sy = w.y1;
    for (let i = 1; i < n; i++){
      const x = w.x1 + dx*i, y = w.y1 + dy*i;
      if (P.has(k(x,y))){ push(sx,sy,x,y); sx = x; sy = y; }
    }
    push(sx,sy,w.x2,w.y2);
  }
  S.wires = out;
}

let RES = {comp:{}, wire:[], src:{}, nv:[], ok:true, nn:0, f:50};
let byName = {};
function nameMap(){
  const m = {};
  for (const c of S.comps) if (c.n && (c.t==='coil'||c.t==='tmr'||c.t==='tank')) m[c.n] = c;
  return m;
}
function contactClosed(ref){
  const k = byName[ref];
  if (!k) return false;
  return k.t === 'tmr' ? !!k._done : !!k._on;
}
// admittance ของโหลดเหนี่ยวนำ: |Y| = S/V², มุม −acos(pf)
function yInd(V, S, pf){
  const m = S / (V*V); pf = Math.min(1, Math.max(0.05, pf));
  return [m*pf, -m*Math.sqrt(1-pf*pf)];
}
// มอเตอร์เหนี่ยวนำ: ขณะสตาร์ท (ความเร็ว _sp ต่ำ) กระแส = Ist×In, pf ≈ 0.35 แล้วลดลงเมื่อเร่งถึงความเร็ว
function motY(c, V, S, pf, ac){
  // สลิปจริง = ความถี่ซิงโครนัส − ความเร็วรอบ (pu ของความถี่ฐาน): ไฟบ้าน fs = 1 → เท่ากับแบบเดิม, ขับด้วย VFD ออกตัวที่สลิปต่ำ จึงไม่มีกระแสสตาร์ทสูง
  const fs = c._fs == null ? 1 : Math.max(0.02, c._fs), sp = 1 - Math.min(1, Math.max(0, (c._fs == null ? 1 : c._fs) - (c._sp || 0))), k = c.Ist || 1, m = 1 + (k - 1)*(1 - sp*sp);
  const pfx = Math.min(pf, 0.35) + (pf - Math.min(pf, 0.35))*sp*sp;
  const ld = c._fs != null && c.tank ? Math.max(0.25, Math.min(1, c._fs)**2) : 1;   // ปั๊ม/พัดลม: แรงบิดโหลด ∝ ความเร็ว²
  const y = indLoad(V, S*m*ld, pfx, ac);
  return c._fs == null || !ac ? y : [y[0]/fs, y[1]/fs];
}
function indLoad(V, S, pf, ac){
  const y = yInd(V, S, pf);
  return ac ? y : [Math.hypot(y[0], y[1]) * 4, 0];   // DC: เหลือแค่ความต้านทานขดลวด
}
// admittance [G,B] ของอุปกรณ์ 2 ขั้วแบบพาสซีฟ, null = ต้องจัดการพิเศษ
function admit(c, isAC, w){
  switch (c.t){
    case 'res':   return [c._blown ? GOFF : 1/Math.max(c.R, 1e-3), 0];
    case 'lamp':  return [c._blown ? GOFF : c.P/(c.V*c.V), 0];
    case 'sw':    return [c.on ? GW : GOFF, 0];
    case 'pb':    return [c._pr ? GW : GOFF, 0];
    case 'pbnc':  return [c._pr ? GOFF : GW, 0];
    case 'fuse':  return [c._blown ? GOFF : GW, 0];
    case 'mcb':   return [c.on ? GW : GOFF, 0];
    case 'no':    return [contactClosed(c.ref) ? GW : GOFF, 0];
    case 'nc':    return [contactClosed(c.ref) ? GOFF : GW, 0];
    case 'float': return [c._on ? GW : GOFF, 0];
    case 'am':    return [GW, 0];
    case 'vm':    return [1e-7, 0];
    case 'cap':   return c._blown ? [GOFF, 0] : isAC ? [0, w*c.C*1e-6] : [GOFF, 0];
    case 'ind': { const R = Math.max(c.R, 0.01); if (!isAC) return [1/R, 0];
                  const X = w*c.Lh, d = R*R + X*X; return [R/d, -X/d]; }
    case 'coil': case 'tmr': return c._burnt ? [GOFF,0] : c.dc ? [c.S/(c.V*c.V), 0] : indLoad(c.V, c.S, 0.3, isAC);
    case 'motor1': case 'pump': return motY(c, c.V, c.P*1000/(c.eff*c.pf), c.pf, isAC);
    case 'estop': return [c.act ? GOFF : GW, 0];
    case 'human': return [1/Math.max(c.R, 1), 0];
    case 'cable': return [1/Math.max(cableR(c), 1e-4), 0];
    case 'fluo':  return indLoad(c.V, c.P/c.pf, c.pf, isAC);
    case 'ldr':   return [1/ldrR(c), 0];
    case 'ntc':   return [1/ntcR(c), 0];
    case 'limit': return [((c.mode === 'NC') !== !!c.act) ? GW : GOFF, 0];
    case 'presw': case 'flowsw': case 'tstat': return [pswClosed(c) ? GW : GOFF, 0];
    case 'buzzer':return [1/150, 0];
    case 'dcm':   return [(1 - 0.85*Math.min(1, c._sp || 0))/Math.max(c.R, 0.1), 0];   // แรงเคลื่อนย้อนกลับลดกระแสเมื่อหมุน
  }
  return null;
}

function rsolve(A, b, N){
  A = A.slice(); b = b.slice();
  for (let k = 0; k < N; k++){
    let p = k, mx = Math.abs(A[k*N+k]);
    for (let i = k+1; i < N; i++){ const v = Math.abs(A[i*N+k]); if (v > mx){ mx = v; p = i; } }
    if (mx < 1e-30) continue;
    if (p !== k){
      for (let j = k; j < N; j++){ const t = A[k*N+j]; A[k*N+j] = A[p*N+j]; A[p*N+j] = t; }
      const t = b[k]; b[k] = b[p]; b[p] = t;
    }
    const d = A[k*N+k];
    for (let i = k+1; i < N; i++){
      const f = A[i*N+k] / d; if (f === 0) continue;
      for (let j = k; j < N; j++) A[i*N+j] -= f * A[k*N+j];
      b[i] -= f * b[k];
    }
  }
  const x = new Float64Array(N);
  for (let k = N-1; k >= 0; k--){
    let s = b[k];
    for (let j = k+1; j < N; j++) s -= A[k*N+j] * x[j];
    const d = A[k*N+k]; x[k] = Math.abs(d) < 1e-30 ? 0 : s/d;
  }
  return x;
}
function csolve(Ar, Ai, br, bi, N){
  Ar = Ar.slice(); Ai = Ai.slice(); br = br.slice(); bi = bi.slice();
  for (let k = 0; k < N; k++){
    let p = k, mx = Math.hypot(Ar[k*N+k], Ai[k*N+k]);
    for (let i = k+1; i < N; i++){ const v = Math.hypot(Ar[i*N+k], Ai[i*N+k]); if (v > mx){ mx = v; p = i; } }
    if (mx < 1e-30) continue;
    if (p !== k){
      for (let j = k; j < N; j++){
        let t = Ar[k*N+j]; Ar[k*N+j] = Ar[p*N+j]; Ar[p*N+j] = t;
        t = Ai[k*N+j]; Ai[k*N+j] = Ai[p*N+j]; Ai[p*N+j] = t;
      }
      let t = br[k]; br[k] = br[p]; br[p] = t; t = bi[k]; bi[k] = bi[p]; bi[p] = t;
    }
    const dr = Ar[k*N+k], di = Ai[k*N+k], dd = dr*dr + di*di;
    for (let i = k+1; i < N; i++){
      const ar = Ar[i*N+k], ai = Ai[i*N+k];
      if (ar === 0 && ai === 0) continue;
      const fr = (ar*dr + ai*di)/dd, fi = (ai*dr - ar*di)/dd;
      for (let j = k; j < N; j++){
        const xr = Ar[k*N+j], xi = Ai[k*N+j];
        Ar[i*N+j] -= fr*xr - fi*xi; Ai[i*N+j] -= fr*xi + fi*xr;
      }
      const xr = br[k], xi = bi[k];
      br[i] -= fr*xr - fi*xi; bi[i] -= fr*xi + fi*xr;
    }
  }
  const xr = new Float64Array(N), xi = new Float64Array(N);
  for (let k = N-1; k >= 0; k--){
    let sr = br[k], si = bi[k];
    for (let j = k+1; j < N; j++){
      const ar = Ar[k*N+j], ai = Ai[k*N+j];
      if (ar === 0 && ai === 0) continue;
      sr -= ar*xr[j] - ai*xi[j]; si -= ar*xi[j] + ai*xr[j];
    }
    const dr = Ar[k*N+k], di = Ai[k*N+k], dd = dr*dr + di*di;
    if (dd < 1e-60){ xr[k] = 0; xi[k] = 0; continue; }
    xr[k] = (sr*dr + si*di)/dd; xi[k] = (si*dr - sr*di)/dd;
  }
  return [xr, xi];
}

// ค่าเชิงซ้อนแบบรวม DC+AC: {d, r, i}
const sub = (a,b) => ({d:a.d-b.d, r:a.r-b.r, i:a.i-b.i});
const rms = a => Math.sqrt(a.d*a.d + a.r*a.r + a.i*a.i);
const acm = a => Math.hypot(a.r, a.i);
const pw  = (v,i) => ({P: v.d*i.d + v.r*i.r + v.i*i.i, Q: v.i*i.r - v.r*i.i});
function mulY(yd, ya, v){ return {d: yd[0]*v.d, r: ya[0]*v.r - ya[1]*v.i, i: ya[0]*v.i + ya[1]*v.r}; }

function solveAll(){
  byName = nameMap();

  const nid = (x,y) => { const k = x+','+y; let v = nm.get(k); if (v === undefined){ v = ++nn; nm.set(k, v); } return v; };
  for (const w of S.wires){ w._a = nid(w.x1,w.y1); w._b = nid(w.x2,w.y2); }
  for (const c of S.comps){ c._n = pinsOf(c).map(p => nid(p[0],p[1])); }

        case 'bat': V(n[0], n[1], j, ac ? 0 : c.V, 0, Math.max(c.ri, 1e-4)); break;
        case 'fgen': { const q = fgenPh(c), a = (c.ph || 0)*Math.PI/180 - Math.PI/2;

        case 'src1': Y(n[1], 0, GW, 0); V(n[0], n[1], j, ac ? c.V : 0, 0, 0.05); break;
        case 'src3': { Y(n[3], 0, GW, 0); const vp = c.V/SQ3;
          for (let k = 0; k < 3; k++){ const a = -k*(c.seq||1)*2*Math.PI/3;

        case 'swint': { const x = c.pos === 'X'; Y(n[0], n[x ? 3 : 2], GW, 0); Y(n[1], n[x ? 2 : 3], GW, 0); Y(n[0], n[x ? 2 : 3], GOFF, 0); Y(n[1], n[x ? 3 : 2], GOFF, 0); } break;

          const fo = c._f || 0, on = c._pw && !c._flt && Math.abs(fo) > 0.05, fb = +c.fb || 50;

          const cs = (a, b, I) => { if (ac) return; if (a) zr[a - 1] += I; if (b) zr[b - 1] -= I; };
          Y(n[8], n[11], GW, 0);

          Y(n[10], n[11], 1/10000, 0);
          if (c._pw && c.mbOn !== false) busStamp(n[12], n[13], n[11], FORCE && FORCE.c === c && FORCE.p === 'port' ? FORCE.v : (c._drv ? 1 : null), Y, ac, zr);

            if (fd === 1){ Y(n[6], n[4], 1/25, 0); Y(n[5], n[7], 1/25, 0); } else if (fd === 0){ Y(n[6], n[7], 1/25, 0); Y(n[5], n[4], 1/25, 0); } }

          const src = (x, V, R) => { Y(x, n[3], 1/R, 0); if (!ac){ if (x) zr[x-1] += V/R; if (n[3]) zr[n[3]-1] -= V/R; } };

/* ---------- โหมดข้อความ ---------- */
function compile(src){

/* ---------- แลดเดอร์ ---------- */
// ช่วงของแถว: ขอบเขตที่แถวนี้มีของต่ออยู่ (แถว 0 ครบทั้งรัง)

/* ---------- PID (ฟิลด์ pidList บรรทัดละวง: EN PV SP MV Kp Ti Td [ต่ำ สูง]) ----------

    for (const c of nls) if (c.t === 'opamp'){ const n = c._n, mid = (V(n[3]) + V(n[4]))/2, st = c._os || 'lin';

    for (const q of caps){ const n = q.c._n, v = V(n[0]) - V(n[1]), i = q.G*v - q.k*(4*q.c._vc - q.c._vc2); q.c._vc2 = q.c._vc; q.c._vc = v; if (rec) acc(q.c, 0, v, i); }
    for (const q of inds){ const n = q.c._n, v = V(n[0]) - V(n[1]), i = q.G*v + q.G*q.k*(4*q.c._il - q.c._il2); q.c._il2 = q.c._il; q.c._il = i; if (rec) acc(q.c, 0, v, i); }

      const jc = new Map();

const KEY = 'circuit-board-v2';
let hist = [], cur = null, fut = [];
function strip(o){ const r = {}; for (const k in o) if (k[0] !== '_') r[k] = o[k]; return clone(r); }
function ser(){
  return JSON.stringify({v:2, nid:S.nid, fac:S.fac || undefined, trend:S.trend || undefined, exp:S.exp || undefined, comps:S.comps.map(strip), wires:S.wires.map(w => ({x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2}))});
}
function mkComp(t, x, y, p){
  const c = Object.assign({id:0, t, x, y, r:0}, clone(T[t].d), p || {});
  if (t === 'plc' && !c.prog) c.prog = defaultProg();
  return c;
}
function load(o){
  if (typeof o === 'string') o = JSON.parse(o);
  S = {comps:[], wires:(o.wires||[]).map(w => ({x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2})), nid:o.nid || 1, fac:o.fac ? (o.fac.items ? clone(o.fac) : facPreset('sort')) : null, trend:o.trend ? clone(o.trend) : null, exp:o.exp ? clone(o.exp) : null};
  if (typeof trendReset === 'function') trendReset();
  if (S.fac) S.fac.items = S.fac.items.filter(i => FKIND[i.k]).map(i => Object.assign(clone(FKIND[i.k].d), i));   // เติมฟิลด์ใหม่ให้ฉากที่บันทึกไว้ก่อน
  facReset();
  for (const c of o.comps||[]){ if (!T[c.t]) continue; const k = mkComp(c.t, c.x, c.y, c); S.comps.push(k); S.nid = Math.max(S.nid, k.id + 1); }
  normalize(!!o.raw);
  RES = {comp:{}, wire:[], src:{}, nv:[], nvv:[], ok:true, nn:0, f:50};
  sel = null; needSolve = true; settle();
  if (typeof onLoaded === 'function') onLoaded();
}
function save(){ try { localStorage.setItem(KEY, cur); } catch (e) {} }
function pushHist(){ if (cur !== null){ hist.push(cur); if (hist.length > 100) hist.shift(); } }
function commit(){
  normalize(); pushHist(); fut = []; cur = ser(); save(); needSolve = true;
  if (typeof refreshUI === 'function') refreshUI();
}
function undo(){
  if (!hist.length) return;
  if (cur !== null) fut.push(cur);
  cur = hist.pop(); load(JSON.parse(cur)); save();
  if (typeof refreshUI === 'function') refreshUI();
}
function autoName(t){
  const pre = T[t].pre; if (!pre) return '';
  let mx = 0;
  for (const c of S.comps){ const m = new RegExp('^' + pre + '(\\d+)$').exec(c.n||''); if (m) mx = Math.max(mx, +m[1]); }
  return pre + (mx + 1);
}

  const comps = [], wires = []; let id = 1;
  const C = (t, x, y, p) => { const c = mkComp(t, x, y, p); c.id = id++; comps.push(c); return c; };
  const W = (...pts) => { for (let i = 0; i+1 < pts.length; i++) wires.push({x1:pts[i][0], y1:pts[i][1], x2:pts[i+1][0], y2:pts[i+1][1]}); };
  fn(C, W);
  return {v:2, raw:true, nid:id, comps, wires};
}

#include <WiFi.h>
#include <ArduinoModbus.h>

const char* password = "12345678";

void setup() {
  Serial.begin(115200);
  pinMode(4, INPUT_PULLUP);
  pinMode(LED_BUILTIN, OUTPUT);
  WiFi.begin(ssid, password);

  modbus.coilWrite(5, digitalRead(4) == LOW);
  int q0 = modbus.coilRead(100);

  Serial.print(cnt);

  pinMode(GATE, OUTPUT);

  last = now;
  delay(20);
}

function fmt(x, u){
  if (x === undefined || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a < 1e-9) return '0 ' + u;
  for (const [m, s] of [[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']]){
    if (a >= m*0.9995 || m === 1e-9){ const v = x/m, b = Math.abs(v);

function wireColor(i, w){
  const pick = n => {
    const v = RES.nvv[n]; if (!v) return null;
    const a = Math.hypot(v.r, v.i);
    if (a > 1){
      const ang = Math.atan2(v.i, v.r)*180/Math.PI, d = x => Math.abs(((ang - x + 540) % 360) - 180);
      return [[0,K.l1],[-120,K.l2],[120,K.l3]].sort((p,q) => d(p[0]) - d(q[0]))[0][1];
    }
    if (v.d > 1) return K.dcp;
    return null;
  };
  const c = pick(w._a) || pick(w._b);
  if (c) return c;
  const I = RES.wire[i];
  if (I && Math.max(Math.abs(I.d), Math.hypot(I.r, I.i)) > 1e-3) return K.nwire;

function dots(x1, y1, x2, y2, I, tt){
  const dc = Math.abs(I.d), ac = Math.hypot(I.r, I.i), m = Math.max(dc, ac);
  if (m < 1e-4) return;
  const len = Math.hypot(x2 - x1, y2 - y1); if (len < 1) return;
  const ux = (x2 - x1)/len, uy = (y2 - y1)/len, sp = 16;
  const mag = Math.min(1, Math.max(0.15, Math.log10(m/1e-4)/4));
  let off = dc >= ac ? Math.sign(I.d)*tt*70*mag : Math.sin(2*Math.PI*0.7*tt - Math.atan2(I.i, I.r))*sp*0.45*(0.5 + mag);
  off = ((off % sp) + sp) % sp;
  for (let s = off; s < len; s += sp) dot(x1 + ux*s, y1 + uy*s, 2.6);
}

    const p = pinsOf(c); dots(p[0][0]*G, p[0][1]*G, p[1][0]*G, p[1][1]*G, R.i, tt);
  }
}

// จุดที่สายผ่านโดยไม่ต่อ: ปลายสาย/ขั้วอื่นอยู่กลางเส้น หรือสายแนวตั้งตัดผ่านสายแนวนอน → วาดสะพานโค้ง (hop)
function wireNodes(){ const n = new Set(); for (const w of S.wires){ n.add(w.x1 + ',' + w.y1); n.add(w.x2 + ',' + w.y2); }
  for (const c of S.comps) for (const p of pinsOf(c)) n.add(p[0] + ',' + p[1]); return n; }
function wireHops(){
  const nodes = wireNodes(), vcov = new Set(), out = {};
  for (const w of S.wires) if (w.x1 === w.x2 && w.y1 !== w.y2){ const a = Math.min(w.y1, w.y2), b = Math.max(w.y1, w.y2); for (let y = a; y <= b; y++) vcov.add(w.x1 + ',' + y); }
  S.wires.forEach((w, i) => {
    const h = w.y1 === w.y2, v = w.x1 === w.x2; if (h === v) return;
    const n = Math.abs(h ? w.x2 - w.x1 : w.y2 - w.y1), sx = Math.sign(w.x2 - w.x1), sy = Math.sign(w.y2 - w.y1), L = [];

}

    ctx.lineTo(px - sx*r, py - sy*r);
    // โค้งขึ้นด้านบน (สายแนวนอน) หรือไปทางซ้าย (สายแนวตั้ง)
    if (h) ctx.arc(px, py, r, sx > 0 ? Math.PI : 0, sx > 0 ? 0 : Math.PI, sx < 0);
    else ctx.arc(px, py, r, sy > 0 ? -Math.PI/2 : Math.PI/2, sy > 0 ? Math.PI/2 : -Math.PI/2, sy > 0); }

function compBox(c){
  if (isTwo(c)){ const p = pinsOf(c); return [Math.min(p[0][0],p[1][0]) - 0.45, Math.min(p[0][1],p[1][1]) - 0.45, Math.max(p[0][0],p[1][0]) + 0.45, Math.max(p[0][1],p[1][1]) + 0.45]; }

  const b = T[c.t].box; return [c.x + b[0], c.y + b[1], c.x + b[2], c.y + b[3]];

function s2g(e){ const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) - view.x)/view.z/G, ((e.clientY - r.top) - view.y)/view.z/G]; }
function segDist(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, l = dx*dx + dy*dy;
  const t = l ? Math.max(0, Math.min(1, ((px - x1)*dx + (py - y1)*dy)/l)) : 0;
  return Math.hypot(px - x1 - t*dx, py - y1 - t*dy);

// ระยะจับขั้ว (หน่วยกริด): ราว 10 px บนจอ (นิ้วสัมผัส 18 px) ไม่ว่าซูมเท่าใด แต่ไม่เกินครึ่งช่อง
let pinTol = 0.25;
const setPinTol = e => { pinTol = Math.max(0.22, Math.min(0.45, ((e && e.pointerType === 'touch') ? 18 : 10)/(G*view.z))); };

function hitPin(gx, gy){
  let best = null, bd = pinTol;
  const chk = (x, y) => { const d = Math.hypot(x - gx, y - gy); if (d < bd){ bd = d; best = {x, y}; } };
  for (const c of S.comps) for (const p of pinsOf(c)) chk(p[0], p[1]);
  for (const w of S.wires){ chk(w.x1, w.y1); chk(w.x2, w.y2); }

}
// ---------- สายไฟตามอุปกรณ์เมื่อย้าย/หมุน ----------
// จำสายเดิม ขั้วเดิม และขั้วของอุปกรณ์อื่นที่ชนกันอยู่ (ต่อกันตรงโดยไม่มีสาย)

  for (const d of S.comps) if (d !== c) for (const q of pinsOf(d)) pins.forEach((p, i) => { if (p[0] === q[0] && p[1] === q[1]) shared.push({i, x:q[0], y:q[1]}); });
  return {orig:S.wires.map(w => ({...w})), pins, shared};
}
// สร้างสายใหม่: ปลายสายที่อยู่บนขั้วเดิมย้ายตามขั้วใหม่ ถ้าเอียงให้หักฉาก (ด้านปลายที่อยู่กับที่คงทิศเดิม)
function followApply(c, F){
  const np = pinsOf(c), mp = new Map(F.pins.map((p, i) => [p[0] + ',' + p[1], np[i]])), out = [];
  // หักฉากโดยเลี่ยงไม่ให้มุมไปอยู่บนตัวอุปกรณ์ (เช่นตอนหมุน) ซึ่งจะทำให้ขั้วทั้งสองถูกลัด
  const bx = compBox(c), inBox = (x, y) => x > bx[0] && x < bx[2] && y > bx[1] && y < bx[3];
  const L = (fx, fy, mx, my, horiz) => { if (fx === mx || fy === my){ out.push({x1:fx, y1:fy, x2:mx, y2:my}); return; }
    if (inBox(horiz ? mx : fx, horiz ? fy : my)) horiz = !horiz;
    const cx = horiz ? mx : fx, cy = horiz ? fy : my; out.push({x1:fx, y1:fy, x2:cx, y2:cy}, {x1:cx, y1:cy, x2:mx, y2:my}); };
  for (const w of F.orig){
    const a = mp.get(w.x1 + ',' + w.y1), b = mp.get(w.x2 + ',' + w.y2);
    if (!a && !b){ out.push({...w}); continue; }
    const A = a ? a : [w.x1, w.y1], B = b ? b : [w.x2, w.y2], horiz = w.y1 === w.y2;
    if (a && b){ L(A[0], A[1], B[0], B[1], horiz); continue; }
    if (a) L(B[0], B[1], A[0], A[1], horiz); else L(A[0], A[1], B[0], B[1], horiz);

}
function hitComp(gx, gy){
  for (let i = S.comps.length - 1; i >= 0; i--){
    const c = S.comps[i];
    if (isTwo(c)){ const p = pinsOf(c); if (segDist(gx, gy, p[0][0], p[0][1], p[1][0], p[1][1]) < 0.38) return c; }
    else { const b = compBox(c); if (gx >= b[0] && gx <= b[2] && gy >= b[1] && gy <= b[3]) return c; }
  }

}
function hitWire(gx, gy){
  for (let i = S.wires.length - 1; i >= 0; i--){ const w = S.wires[i]; if (segDist(gx, gy, w.x1, w.y1, w.x2, w.y2) < 0.18) return i; }

  pump:'ปั๊มเป็นมอเตอร์ 1 เฟส สูบน้ำเข้าถังที่อ้างอิงตามอัตราที่ตั้ง (% ต่อวินาที)',
  tank:'ระดับน้ำเพิ่มตามปั๊มที่อ้างอิงถังนี้ และลดลงตามอัตราการใช้น้ำ',

  uno:'Arduino Uno (ATmega328P): ไฟเลี้ยง 5 V จาก USB · ขา D2–D13 และ A0–A5 · PWM (analogWrite) ที่ขา 3, 5, 6, 9, 10, 11 · ADC 10 บิต (0–1023) · จ่ายกระแสได้ไม่เกิน 40 mA ต่อขา · LED บนบอร์ดอยู่ที่ขา 13',

  pico:'Raspberry Pi Pico (RP2040): ทำงานที่ 3.3 V · จ่ายกระแสได้ราว 12 mA ต่อขา จึงควรใช้ตัวต้านทานค่าสูงกับ LED · ADC ที่ GP26–28 (A0–A2) · LED บนบอร์ดอยู่ที่ GP25 (ไม่มีขาออกมา)',
  ldr:'LDR: ความต้านทานลดลงเมื่อแสงมากขึ้น (≈10 kΩ ที่ 10 lx, ≈1 kΩ ที่ 300 lx) · ต่อเป็นวงจรแบ่งแรงดันกับตัวต้านทานแล้วอ่านด้วย analogRead',
  ntc:'เทอร์มิสเตอร์ NTC: ความต้านทานลดลงเมื่ออุณหภูมิสูงขึ้น R = R25·e^(B(1/T − 1/298 K)) · ต่อเป็นวงจรแบ่งแรงดันแล้วอ่านด้วย analogRead',
  limit:'ลิมิตสวิตช์: ถูกกดเมื่อชิ้นงานหรือกลไกมาชน · คลิกบนแผงเพื่อกด/ปล่อย',
  buzzer:'บัซเซอร์: ดังเมื่อมีกระแสไหล (> 5 mA) · ใช้ tone(ขา, ความถี่) / noTone(ขา) ในโค้ด',
  pir:'PIR ตรวจจับความร้อนจากคนที่เคลื่อนที่ · ขา OUT เป็น HIGH ค้างตามเวลาที่ตั้ง · คลิกบนแผงเพื่อจำลองการเคลื่อนไหว · ใช้ไฟ 3.3–5 V',
  sr04:'HC-SR04 วัดระยะด้วยคลื่นเสียง: ส่งพัลส์ที่ TRIG แล้วจับเวลาพัลส์ที่ ECHO ด้วย pulseIn(ECHO, HIGH) · ระยะ (cm) = เวลา (µs) / 58',
  dht:'DHT22 วัดอุณหภูมิและความชื้นผ่านสายข้อมูลเส้นเดียว · ในโค้ดใช้ #include <DHT.h>, DHT dht(ขา, DHT22); dht.readTemperature(), dht.readHumidity()',
  soil:'เซนเซอร์ความชื้นดินแบบแอนะล็อก: ดินแห้ง → แรงดัน AO สูง, ดินเปียก → แรงดันต่ำ · อ่านด้วย analogRead',
  servo:'เซอร์โวหมุนไปยังมุม 0–180° ตามคำสั่ง · ในโค้ดใช้ Servo s; s.attach(ขา); s.write(มุม) · ต่อสาย GND, VCC และ SIG เข้าขาของบอร์ด',
  prox:'พร็อกซิมิตี้เซนเซอร์แบบเหนี่ยวนำ 3 สาย (น้ำตาล +V, ดำ OUT, ฟ้า 0V) ตรวจจับโลหะโดยไม่สัมผัส · PNP จ่าย +24 V ให้อินพุต PLC (COM ต่อ 0 V) · NPN ดึงสัญญาณลง 0 V (COM ต้องต่อ +24 V) · คลิกบนแผงเพื่อวาง/เอาวัตถุออก',
  cd4017:'CD4017 ตัวนับทศวรรษ: ทุกขอบขาขึ้นของ CLK (EN = LOW) ขาออก Q0→Q9 ติดทีละขาวนไป · RST = HIGH กลับไป Q0 · CO = HIGH เมื่อนับ 0–4 (ต่อเข้า CLK ตัวถัดไปเพื่อนับหลักสิบ) · ต่อ Qn เข้า RST = นับแค่ n · ใช้กับ NE555 ทำไฟวิ่ง',
  hc595:'74HC595 ชิฟต์รีจิสเตอร์ 8 บิต: ขอบขึ้นของ SRCLK เลื่อนบิตจาก SER เข้า Q0 (บิตเดิมเลื่อนไป Q1…) · ขอบขึ้นของ RCLK (latch) คัดลอกไปขาออก Q0–Q7 พร้อมกัน · OE̅ = LOW เปิดขาออก, MR̅ = HIGH (LOW = ล้าง) · Q7S ต่อ SER ของตัวถัดไปเพื่อเพิ่มขา · Arduino ใช้ shiftOut(dataPin, clockPin, MSBFIRST, ค่า) แล้วสั่ง latch',
  cnt4:'ตัวนับ 4 บิต: นับขึ้นทุกขอบขาขึ้นของ CLK เมื่อ EN = HIGH · RST = HIGH ล้างเป็น 0 · โหมด BCD (CD4518) นับ 0–9, ฐานสอง (CD4520) นับ 0–15 · ขาออก Q0 (บิตต่ำ) – Q3 ต่อเข้า CD4511 เพื่อแสดงตัวเลข',
  cd4511:'CD4511 ถอดรหัส BCD (A = บิตต่ำ … D) เป็นส่วน a–g สำหรับตัวเลข 7 ส่วนแคโทดร่วม · LT̅ = LOW ทดสอบไฟทุกส่วน, BI̅ = LOW ดับ (ปกติต่อ VCC ทั้งคู่) · LE = HIGH จำค่าเดิม (ปกติต่อ GND) · ค่า 10–15 ดับ · ขาออกจ่ายกระแสได้ราว 25 mA (ต้องมีตัวต้านทานต่อส่วน — seg7 ในแผงมีในตัว)',
  lm317:'LM317 เร็กกูเลเตอร์ปรับค่า: รักษาแรงดัน OUT − ADJ = 1.25 V · ต่อ R1 (240 Ω) จาก OUT ไป ADJ และ R2 จาก ADJ ลงกราวด์ → Vout = 1.25 × (1 + R2/R1) · ใช้ pot เป็น R2 เพื่อปรับแรงดัน · ต้องการ Vin ≥ Vout + 2 V · กระแส ADJ ≈ 50 µA',
  lm35:'LM35 เซนเซอร์อุณหภูมิ: ขา OUT ให้ 10 mV/°C (25 °C = 0.25 V) ไฟเลี้ยง 4–30 V · TMP36 ให้ 0.5 V ที่ 0 °C + 10 mV/°C ใช้ไฟ 2.7–5.5 V · อ่านด้วย analogRead แล้วแปลง: °C = V × 100 · เลื่อนแถบอุณหภูมิในแผงขวาเพื่อจำลอง',
  fgen:'เครื่องกำเนิดสัญญาณ: ขาออก OUT เทียบ COM ผ่านอิมพีแดนซ์ 50 Ω (เหมือนเครื่องจริง — ต่อโหลดต่ำแรงดันจะตก) · ไซน์/สี่เหลี่ยม/สามเหลี่ยม/ฟันเลื่อย/พัลส์ + ออฟเซ็ต · วงจรที่มีเครื่องนี้จะจำลองตามเวลาจริง · ใช้เป็นแหล่งสัญญาณของการวิเคราะห์ AC (Bode) ในหน้าต่าง "วิเคราะห์"',
  lcd:'จอ LCD I2C: ต่อ SDA/SCL เข้าขา I2C ของบอร์ด (Uno A4/A5, ESP32 GPIO21/22, Pico GP4/GP5) + VCC 5 V + GND · โค้ด: #include <LiquidCrystal_I2C.h>, LiquidCrystal_I2C lcd(0x27, 16, 2); lcd.init(); lcd.backlight(); lcd.setCursor(คอลัมน์, แถว); lcd.print(ข้อความ) · แอดเดรสในโค้ดต้องตรงกับโมดูล (0x27 หรือ 0x3F) ไม่เช่นนั้นจอไม่แสดง · ยังไม่ส่งคำสั่ง init จอจะเห็นแถวบนเป็นช่องดำ (เหมือนจริง)',
  lbl:'ป้ายชื่อสาย: วางป้ายที่มีชื่อเดียวกัน (เช่น VCC, GND, SDA) ไว้หลายจุด จุดเหล่านั้นจะต่อถึงกันทางไฟฟ้าโดยไม่ต้องลากสายข้ามแผง · ตัวพิมพ์เล็ก/ใหญ่ถือว่าเหมือนกัน · ป้ายสีส้ม = ยังไม่มีคู่',
  gate:'ลอจิกเกต: อินพุต A, B เป็น HIGH เมื่อแรงดันเทียบ GND เกินครึ่งหนึ่งของ VCC (CMOS) หรือ ≈ 1.4 V (TTL) · ขาออก Y เป็นแหล่ง VCC/0 V ผ่านความต้านทานขาออก (74HC ≈ 50 Ω ขับ LED + R ได้) · ต้องต่อ VCC/GND · อินพุต CMOS ห้ามปล่อยลอย (ใส่ pull-up/pull-down 10 kΩ) · ชมิตต์ทริกเกอร์ (74HC14) มีเกณฑ์ขึ้น/ลงต่างกัน ใช้ทำออสซิลเลเตอร์ RC ได้',
  dff:'D ฟลิปฟล็อป: ตอนขอบขาขึ้นของ CLK จะจำค่า D ไว้ที่ Q (Q̄ = กลับค่า) และคงค่าไว้จนขอบถัดไป · ต่อ Q̄ กลับเข้า D = หารความถี่ด้วย 2 (toggle) · ต่อหลายตัวเป็นตัวนับ/ชิฟต์รีจิสเตอร์ได้',
  opamp:'ออปแอมป์: ขาออก = A × (V+ − V−) จนติดราง · มีป้อนกลับลบ (R จาก OUT ไป −) → ขยายตามอัตราส่วน R: ไม่กลับเฟส 1 + Rf/R1, กลับเฟส −Rf/R1, บัฟเฟอร์ = ต่อ OUT เข้า − · ไม่มีป้อนกลับ = คอมพาราเตอร์ (ขาออกติด V+ หรือ V−) · ป้อนกลับบวก = ชมิตต์ทริกเกอร์/ออสซิลเลเตอร์ · GBW จำกัดอัตราขยายที่ความถี่สูง (จำลองในโหมดตามเวลาและ AC) · LM358 ลงถึง 0 V ได้ แต่ขึ้นได้แค่ V+ − 1.5 V · LM393 ขาออก open collector ต้องมีตัวต้านทาน pull-up',
  bridge:'ไดโอดบริดจ์ (เรียงกระแสเต็มคลื่น): ขา ~ ต่อขดทุติยภูมิหม้อแปลง ได้ไฟกระเพื่อมความถี่ 2 เท่า (100 Hz) ที่ + และ − · ใส่ตัวเก็บประจุกรองขนานโหลดเพื่อลดริปเปิล (ริปเปิล ≈ I ÷ (2·f·C)) · ไฟผ่านไดโอด 2 ตัวจึงตก ≈ 1.4–2 V · วงจรที่มีแหล่ง AC + ไดโอด หรือมีตัวเก็บประจุ/ขดลวด จะจำลองตามเวลาจริงอัตโนมัติ (ก้าว 100 µs) สโคปเห็นรูปคลื่นจริง',
  rs485:'วัดแรงดันบัส: บัสว่างที่มีตัวต้านทานปลายสาย 120 Ω สองปลาย วัด A−B ได้ ≈ 0 V เป็นเรื่องปกติ (ไม่มีใครขับ) แต่ละเส้นเทียบ GND ราว 2.5 V · ไบแอส fail-safe (A ดึงขึ้น B ดึงลง) ทำให้บัสว่างเป็น "1" ชัดเจน ≈ 0.2 V · ขณะส่งตัวขับดัน A−B ±1.5–5 V · โมดูล RS-485 (ใช้กับ Modbus RTU ได้ — ดูตัวอย่าง "Modbus RTU"): แปลง UART (TTL) เป็นสัญญาณผลต่าง A–B บนสายคู่บิดเกลียว ส่งได้ไกล ~1200 m ต่อได้หลายตัวบนบัสเดียว (half-duplex) · DI ← TX ของบอร์ด, RO → RX ของบอร์ด, DE = HIGH ขณะส่ง, RE = LOW ขณะรับ (นิยมต่อ DE กับ RE เข้าขาเดียว) · ต่อ A–A, B–B (สลับ = ข้อมูลกลับบิต) และใส่ตัวต้านทานปลายสาย 120 Ω ที่ปลายบัสทั้งสองด้าน · MAX487 จำกัดความเร็ว 250 kbps แต่ต่อได้ 128 ตัว',
  rs232:'โมดูล MAX3232: แปลงระดับ TTL (0/3.3–5 V) ↔ RS-232 (±5–12 V) สำหรับพอร์ต COM ของคอมพิวเตอร์ เครื่องชั่ง PLC รุ่นเก่า · T1IN ← TX ของบอร์ด → T1OUT (DB9 ขา 3), R1IN (DB9 ขา 2) → R1OUT → RX ของบอร์ด · ต่อไขว้ TX → RX เสมอ (null-modem) · ห้ามต่อ RS-232 เข้าขาบอร์ดตรง ๆ',

function parseSI(s){
  const m = /^\s*(-?\d*\.?\d+(?:e[-+]?\d+)?)\s*([kKMmuµn]?)\s*$/.exec(String(s));
  if (!m) return NaN;
  return +m[1] * ({k:1e3, K:1e3, M:1e6, m:1e-3, u:1e-6, 'µ':1e-6, n:1e-9}[m[2]] || 1);
}

  if (!RES.ok) w.push(['bad','คำนวณวงจรไม่ได้ — ตรวจหาการลัดวงจรของแหล่งจ่าย']);
  for (const c of S.comps){
    const R = RES.comp[c.id] || {}, n = esc(c.n || c.ref || T[c.t].nm);
    const srcI = c.t === 'src1' ? R.I : c.t === 'src3' ? Math.max(...(R.Iph||[0])) : (c.t === 'bat' || c.t === 'acs') ? R.Ir : 0;
    if (srcI > 100) w.push(['bad', `ลัดวงจร! ${n} จ่ายกระแส ${fmt(srcI, 'A')}`]);
    if (c.t === 'mcb' && c._trip) w.push(['warn', `เบรกเกอร์ ${n} ทริป — คลิกที่เบรกเกอร์เพื่อรีเซ็ต`]);
    if (c.t === 'fuse' && c._blown) w.push(['bad', `ฟิวส์ ${n} ขาด`]);
    if (c.t === 'vfd' && c._flt) w.push(['bad', `อินเวอร์เตอร์ ${n} ฟอลต์ ${VFD_FLT[c._flt][1]} — กดรีเซ็ตในแผงขวา`]);
    if (c.t === 'vfd' && c._pw && !S.comps.some(m => m._vfd === c)) w.push(['warn', `อินเวอร์เตอร์ ${n} ยังไม่ได้ต่อมอเตอร์ 3 เฟสที่ขา U V W`]);
    if (c.t === 'lamp' && c._blown) w.push(['bad', `หลอด ${n} ขาด (แรงดันเกินพิกัด)`]);
    if (c.t === 'led' && c._blown) w.push(['bad', `LED ${n} เสีย (กระแสเกิน)`]);
    if (c.t === 'res' && c._blown) w.push(['bad', `ตัวต้านทาน ${n} ไหม้ (กำลังเกินพิกัด ${c.Pr} W) — วงจรขาด เลือกแล้วกด "เปลี่ยนตัวต้านทานใหม่"`]);
    if (c.t === 'res' && !c._blown && (c._heat || 0) > 1) w.push(['bad', `ตัวต้านทาน ${n} ร้อนจัด กำลังจะไหม้!`]);
    if (c.t === 'cap' && c._blown) w.push(['bad', `ตัวเก็บประจุ ${n} ระเบิด (${c.pol ? 'กลับขั้ว/' : ''}แรงดันเกิน) — เลือกแล้วกด "เปลี่ยนตัวเก็บประจุใหม่"`]);
    if (c.t === 'lbl' && S.comps.filter(o => o.t === 'lbl' && String(o.net || '').trim().toUpperCase() === String(c.net || '').trim().toUpperCase()).length < 2) w.push(['warn', `ป้ายชื่อสาย "${esc(c.net)}" มีอันเดียว — ต้องมีป้ายชื่อเดียวกันอย่างน้อย 2 อันจึงจะต่อถึงกัน`]);
    if (c.t === 'led' && !c._blown && c._on && R.i && R.i.d > c.Imax) w.push(['warn', `LED ${n} กระแส ${fmt(R.i.d, 'A')} เกินพิกัด`]);
    if (c.t === 'led' && !c._on && R.v && R.v.d < -Math.max(2.6, c.Vf + 0.3)) w.push(['warn', `LED ${n} ต่อกลับขั้ว`]);
    if ((c.t === 'coil' || c.t === 'tmr') && c._burnt) w.push(['bad', `คอยล์ ${n} ไหม้ (แรงดันเกิน)`]);
    if (c.t === 'psu' && c._ol) w.push(['bad', `${n} โหลดเกิน ${c.Imax} A — ตัดไฟชั่วคราว`]);
    if (c.t === 'motor3' && c._hum) w.push(['bad', `มอเตอร์ ${n} ขาดเฟส — ครางและร้อน ควรตัดไฟทันที`]);
    if (c.t === 'motor3' && c._run && c._dir < 0) w.push(['warn', `มอเตอร์ ${n} หมุนกลับทาง (ลำดับเฟสกลับ)`]);
    if (c.t === 'hmi' && c._pw && (c.proto === 'modbus' || c.proto === 'tcp') && c._mb && c._mb.tx > 3 && simT - (c._mb.tOk ?? -9) > 1)
      w.push(['warn', `${n}: Modbus ไม่ได้รับคำตอบ — ${esc(c._mb.lastErr || '')} (ตรวจ PLC เปิด Modbus แบบสเลฟ, ID, บอด และสาย A/B)`]);
    if (c.t === 'hmi' && c._pw && c.proto === 'link' && !c._link) w.push(['warn', c._swap ? `${n}: สาย RS-485 A/B สลับกัน` : `${n} ยังไม่เชื่อมต่อ PLC`]);
    if (c.t === 'plc' && c.prog && getProg(c).err.length) w.push(['bad', `${n}: โปรแกรมมีข้อผิดพลาด`]);
    if ((c.t === 'no' || c.t === 'nc' || c.t === 'k3') && !byName[c.ref]) w.push(['warn', `หน้าสัมผัสอ้างอิง "${esc(c.ref)}" แต่ไม่มีคอยล์ชื่อนี้`]);
    if (c.t === 'xfmr' && R.Vs*R.Is > c.S*1.05) w.push(['warn', `หม้อแปลง ${n} จ่ายเกินพิกัด`]);
    const md = modelOf(c), rated = md ? ' (' + md.nm + ')' : '';
    if (c.t === 'res' && R.P > c.Pr) w.push([R.P > 2*c.Pr ? 'bad' : 'warn', `ตัวต้านทาน ${n} กินกำลัง ${fmt(R.P, 'W')} เกินพิกัด ${c.Pr} W — ร้อนจนไหม้ได้`]);
    if (c.t === 'bridge' && Math.abs(R.Idc || 0) > c.Imax) w.push(['bad', `ไดโอดบริดจ์ ${n} กระแส ${fmt(Math.abs(R.Idc), 'A')} เกินพิกัด ${c.Imax} A`]);
    if (c.t === 'cap' && R.Vr > c.Vr) w.push(['bad', `ตัวเก็บประจุ ${n} รับแรงดัน ${fmt(R.Vr, 'V')} เกินพิกัด ${c.Vr} V — อาจระเบิด`]);
    if (c.t === 'cap' && c.pol && R.v && R.v.d < -0.5) w.push(['bad', `ตัวเก็บประจุอิเล็กโทรไลต์ ${n} ต่อกลับขั้ว`]);
    if (c.t === 'cap' && c.pol && R.v && (R.Vac != null ? R.Vac*1.414 > R.v.d + 0.5 : Math.hypot(R.v.r, R.v.i) > 1)) w.push(['bad', `ตัวเก็บประจุอิเล็กโทรไลต์ ${n} ใช้กับไฟ AC ไม่ได้`]);
    if (c.t === 'sw' && R.Ir > c.In) w.push(['warn', `สวิตช์ ${n} กระแส ${fmt(R.Ir, 'A')} เกินพิกัด ${c.In} A`]);
    if (c.t === 'k3' && (c._ov || 0) > 5) w.push(['warn', `คอนแทกเตอร์ ${esc(c.ref)} กระแสเกินพิกัด AC-3 ${c.In} A`]);
    if (c.t === 'diode' && R.Ir > c.Imax) w.push(['bad', `ไดโอด ${n}${rated} กระแสเกิน ${c.Imax} A`]);
    if (c.t === 'zener' && R.Vr*R.Ir > c.Pmax) w.push(['bad', `ซีเนอร์ ${n} กินกำลังเกิน ${c.Pmax} W`]);
    if (DIG[c.t]){ const f = famOf(c), D = DIG[c.t], pl = T[c.t].pins;
      if (R.vcc > f.vmax + 0.3) w.push(['bad', `ไอซี ${n} ไฟเลี้ยง ${fmt(R.vcc, 'V')} เกินพิกัด ${f.vmax} V — ไอซีเสีย`]);
      else if (!c._pw && Math.abs(R.vcc || 0) > 0.5) w.push(['warn', `ไอซี ${n} ไฟเลี้ยงต่ำเกินไป (ต้อง ≥ ${f.vmin} V)`]);
      if (c._pw && !f.ttl) D.ins.forEach(k => { if (!nodeLinked(c, k)) w.push(['warn', `${n} ขา ${pl[k][2]} ลอย — อินพุต CMOS ต้องต่อ HIGH/LOW (เช่น EN/RST ลง GND, OE̅ ลง GND, MR̅ ขึ้น VCC)`]); }); }
    if (c.t === 'lm317'){ if (R.iout > c.Imax) w.push(['bad', `${n} จ่ายกระแสเกิน ${c.Imax} A`]); if (R.vio*R.iout > 2) w.push(['warn', `${n} ร้อน ${fmt(R.vio*R.iout, 'W')} — ต้องติดแผ่นระบายความร้อน`]);
      if (c._rs === 'do') w.push(['warn', `${n} แรงดันขาเข้าไม่พอ — ต้องสูงกว่าขาออก ≥ ${c.drop} V`]); }
    if (c.t === 'lm35'){ if (!c._pw && Math.abs(R.vs || 0) > 0.5) w.push(['warn', `${n} ไฟเลี้ยงต่ำเกินไป (ต้อง ≥ ${c.vmin} V)`]); if (R.vs > c.vmax + 0.3) w.push(['bad', `${n} ไฟเลี้ยงเกินพิกัด ${c.vmax} V`]); }
    if (c.t === 'gate' || c.t === 'dff'){ const f = famOf(c);
      if (R.vcc > f.vmax + 0.3) w.push(['bad', `ไอซีลอจิก ${n} ไฟเลี้ยง ${fmt(R.vcc, 'V')} เกินพิกัด ${f.vmax} V — ไอซีเสีย`]);
      else if (!c._pw && Math.abs(R.vcc || 0) > 0.5) w.push(['warn', `ไอซีลอจิก ${n} ไฟเลี้ยงต่ำเกินไป (ต้อง ≥ ${f.vmin} V)`]);
      if (c._pw && !f.ttl){ const nIn = c.t === 'gate' && c.fn === 'NOT' ? 1 : 2;
        for (let k = 0; k < nIn; k++){ const lb = c.t === 'dff' ? ['D','CLK'][k] : 'AB'[k];
          if (!nodeLinked(c, k)) w.push(['warn', `${n} ขา ${lb} ลอย — อินพุต CMOS ต้องต่อ HIGH/LOW หรือ pull-up/pull-down`]);
          else if (!c.st && R.vin && R.vin[k] > 0.3*R.vcc && R.vin[k] < 0.7*R.vcc) w.push(['warn', `${n} ขา ${lb} = ${fmt(R.vin[k], 'V')} อยู่ระหว่าง LOW/HIGH (0.3–0.7 VCC) — ระดับลอจิกไม่แน่นอน`]); } } }
    if (c.t === 'opamp'){
      if (R.vs > c.vmax + 0.3) w.push(['bad', `ออปแอมป์ ${n} ไฟเลี้ยง ${fmt(R.vs, 'V')} เกินพิกัด ${c.vmax} V`]);
      else if (!c._pw && Math.abs(R.vs || 0) > 0.5) w.push(['warn', `ออปแอมป์ ${n} ไฟเลี้ยงต่ำเกินไป (ต้อง ≥ ${c.vmin} V)`]);
      if (c._pw && Math.abs(R.io || 0) > c.isc*1e-3) w.push(['warn', `ออปแอมป์ ${n} จ่ายกระแสขาออก ${fmt(Math.abs(R.io), 'A')} เกิน ${c.isc} mA — ของจริงจะจำกัดกระแส/ร้อน ใช้ทรานซิสเตอร์ช่วยขับ`]);
      if (c._pw && R.vin && R.vin.some(v => v > R.pv[3].d + 0.3 || v < R.pv[4].d - 0.3)) w.push(['warn', `ออปแอมป์ ${n} แรงดันอินพุตเกินไฟเลี้ยง`]);
      if (c._pw && c.oc && !nodeLinked(c, 2)) w.push(['warn', `คอมพาราเตอร์ ${n} ขาออก open collector ต้องมีตัวต้านทาน pull-up`]); }
    if (c.t === 'nmos' && R.id > c.Imax) w.push(['bad', `MOSFET ${n}${rated} กระแสเกิน ${c.Imax} A`]);
    if (c.t === 'nmos' && c._mon && c._mg < 0.98 && R.id > 0.05) w.push(['warn', `MOSFET ${n}${rated} แรงดันเกตไม่พอ (Vgs ${fmt(R.vgs, 'V')} < ${c.Vfull} V) — นำไม่เต็มที่และร้อน`]);
    if (c.t === 'cable' && R.Ir > cableAmp(c)) w.push(['bad', `สาย ${n} ${c.A} mm² กระแส ${fmt(R.Ir, 'A')} เกินที่ทนได้ ${fmt(cableAmp(c), 'A')}`]);
    if ((c.t === 'rs485' || c.t === 'rs232') && c._pw){ const [vi, gi] = SENS[c.t], v = R.pv[vi].d - R.pv[gi].d;
      if (v < (c.vmin || 3) - 0.05) w.push(['warn', `${n}: ไฟเลี้ยง ${fmt(v, 'V')} ต่ำกว่าที่ชิปต้องการ (${c.vmin} V)` + (c.t === 'rs485' ? ' — กับบอร์ด 3.3 V ให้ใช้ MAX3485' : '')]); }
    if (c.t === 'lora' && c._pw) for (const o of S.comps) if (loraPeer(o, c) && o.id < c.id){ const L = loraLink(o, c);
      if (!L.ok) w.push(['warn', `ลิงก์ LoRa ${esc(o.n || '')} ↔ ${n} ไม่ถึง: ระยะ ${fmt(L.d, 'm')} RSSI ${L.rssi.toFixed(0)} dBm ต่ำกว่าความไวรับ ${L.sens} dBm (เพิ่ม SF/กำลังส่ง หรือลดระยะ)`]); }
    if (MCU[c.t] && c._v232) w.push(['bad', `${n}: ต่อสาย RS-232 (±12 V) เข้าขาบอร์ดโดยตรง — อาจทำให้ขาเสียหาย ต้องผ่าน MAX3232`]);
    if ((c.t === 'plc' || (c.t === 'hmi' && c.proto === 'tcp')) && c._pw){ const k = ethIdx(c), L = ethLan(), me = L.lan.get(c);
      if (me != null && L.cnt.get(me) > 1){ if (!ipOk(c.ip)) w.push(['warn', `${n}: IP "${esc(c.ip)}" ไม่ถูกต้อง`]);
        else if (S.comps.some(o => o !== c && o.id < c.id && L.lan.get(o) === me && ipOf(o) === ipOf(c))) w.push(['bad', `${n}: IP ${esc(c.ip)} ซ้ำกับอุปกรณ์อื่นบนเครือข่าย (IP conflict)`]); } }
    if (c.t === 'scope'){ const p = scopeProbe(c); if (p) [0, 1].forEach(k => { const px = c['px' + (k + 1)] || 1, lim = px === 10 ? 600 : 300, pk = Math.abs(p[k].d) + Math.SQRT2*acm(p[k]);
      if (pk > lim) w.push(['bad', `ออสซิลโลสโคป ${n}: CH${k + 1} แรงดันยอด ${fmt(pk, 'V')} เกินพิกัดโพรบ ×${px} (${lim} V)` + (px === 1 ? ' — เปลี่ยนเป็นโพรบ ×10' : '')]); }); }
    if (c.t === 'scope'){ const fl = scopeFloat(c); if (fl[0] || fl[1]) w.push(['warn', `ออสซิลโลสโคป ${n}: กราวด์โพรบ (⏚) ไม่ได้ต่อกับวงจรที่วัด${fl[0] && fl[1] ? '' : fl[0] ? ' (CH1)' : ' (CH2)'} — วงจรลอยอยู่ ความต้านทานโพรบกลายเป็นทางกลับ รูปคลื่นจึงเพี้ยนและเปลี่ยนเมื่อต่อ/ถอดอีกแชนเนล · ต่อ ⏚ เข้ากับ GND หรือขั้วลบของแหล่งจ่ายวงจร`]); }
    if (c.t === 'scope' && R.ig > 0.2) w.push(['bad', `ออสซิลโลสโคป ${n}: กราวด์โพรบมีกระแส ${fmt(R.ig, 'A')} ไหลลงสายดิน — คลิปกราวด์ต่อกับจุดที่มีแรงดัน (เช่นสาย L) ทำให้ลัดวงจร`]);
    if (c.t === 'human' && R.Ir > 0.01) w.push(['bad', `⚠ ไฟดูด! กระแสผ่านร่างกาย ${fmt(R.Ir, 'A')}`]);
    if (c.t === 'rcd' && c._trip === 'rcd') w.push(['warn', `เครื่องตัดไฟรั่ว ${n} ตัดไฟ — ตรวจหาจุดรั่วก่อนรีเซ็ต`]);
    if (c.t === 'ol' && c._trip) w.push(['bad', `โอเวอร์โหลด ${n} ทริป — หน้าสัมผัส 95–96 เปิด`]);
    if (c.t === 'motor3' && c.conn === 'D' && R.Vw && Math.max(...R.Vw) > c.V/SQ3*1.3) w.push(['bad', `มอเตอร์ ${n} ต่อเดลต้าบนไฟ ${Math.round(Math.max(...R.Vw))} V — ขดลวดรับแรงดันเกิน ร้อนจนไหม้`]);
    if ((c.t === 'motor3' || c.t === 'motor6') && (c._sp || 0) > 0.95 && !c._hum){
      const In = c.P*1000/(c.eff*c.pf)/(c.t === 'motor6' ? 3*c.V : SQ3*c.V); if (Math.max(...R.ph) > In*1.2*(c.conn === 'D' ? 1/SQ3 : 1)) w.push(['warn', `มอเตอร์ ${n} กระแสเกินพิกัด`]); }
    if (c.t === 'reg' && R.vin > 0.5 && R.vin < c.V + c.drop) w.push(['warn', `${n}: แรงดันขาเข้า ${fmt(R.vin, 'V')} ต่ำเกินไป ต้อง ≥ ${c.V + c.drop} V`]);
    if (c.t === 'reg' && (R.vin - R.vout)*R.iout > 2) w.push(['warn', `${n} ร้อน ${fmt((R.vin - R.vout)*R.iout, 'W')} — ต้องติดแผ่นระบายความร้อน`]);
    if (c.t === 'reg' && R.iout > c.Imax) w.push(['bad', `${n} จ่ายกระแสเกิน ${c.Imax} A`]);
    if ((c.t === 'npn' || c.t === 'pnp') && R.ic > c.Imax) w.push(['bad', `ทรานซิสเตอร์ ${n}${rated} กระแส ${fmt(R.ic, 'A')} เกินพิกัด ${fmt(c.Imax, 'A')}`]);
    if ((c.t === 'npn' || c.t === 'pnp') && c._bj === 'act' && R.ic > 0.01) w.push(['warn', `ทรานซิสเตอร์ ${n} อยู่ย่านขยาย ไม่อิ่มตัว — ถ้าใช้เป็นสวิตช์ให้ลดตัวต้านทานเบส`]);
    if (c.t === 'tx420' && !c._on && R.V > 1) w.push(['warn', `${n}: แรงดันลูป 4–20 mA ไม่พอ (${fmt(R.V, 'V')})`]);
    if (MCU[c.t]){
      const B = MCU[c.t];
      if (c._vm && c._vm.err) w.push(['bad', `${n}: ${esc(c._vm.err)}`]);
      for (const pi of mcuPins(c)){
        if (Math.abs(pi.i) > B.imax) w.push(['bad', `${n} ขา ${pi.label} จ่ายกระแส ${fmt(Math.abs(pi.i), 'A')} เกินพิกัด ${fmt(B.imax, 'A')} — ใส่ตัวต้านทานจำกัดกระแส`]);
        if (pi.v > B.vcc + 0.5) w.push(['bad', `${n} ขา ${pi.label} รับแรงดัน ${fmt(pi.v, 'V')} เกิน ${B.vcc} V — ขาอาจเสียหาย`]);
      }
    }
    if ((c.t === 'pump' || c.t === 'float') && !byName[c.t === 'pump' ? c.tank : c.ref]) w.push(['warn', `${n}: ไม่พบถังน้ำที่อ้างอิง`]);
  }
  return w;
}
function liveUI(){
  const el = $('#ilive');
  if (sel && sel.k === 'c'){ el.innerHTML = compHTML(sel.c); return; }
  if (sel && sel.k === 'w'){ const I = RES.wire[sel.i], w = S.wires[sel.i];
    if (!I || !w){ el.innerHTML = ''; return; }
    el.innerHTML = `<table class="rd"><tr><td>แรงดันเทียบกราวด์</td><td>${fmt(RES.nv[w._a], 'V')}</td></tr><tr><td>กระแส</td><td>${fmt(rms(I), 'A')}</td></tr></table>`; return; }
  let P = 0, Q = 0; for (const k in RES.src){ P += RES.src[k].P; Q += RES.src[k].Q; }
  const w = warnList(); { const bi = $('#bInsp'); if (bi){ bi.classList.toggle('wn', w.length > 0); bi.classList.toggle('bd', w.some(x => x[0] === 'bad')); } }

function rungSVG(rung, ri, mon, img){

        o += L(x + 30, cy - 11, x + 30, cy + 11, closed ? ON : BASE, 2.5) + L(x + 48, cy - 11, x + 48, cy + 11, closed ? ON : BASE, 2.5);
        if (cell.k === 'NC') o += L(x + 27, cy + 12, x + 51, cy - 12, closed ? ON : BASE, 1.8);
        o += T_(cell.a, x + 39, cy - 16, parseAddr(cell.a) ? 'var(--text)' : 'var(--bad)');

const EXP = {busy:false, res:null, stop:false};
function expCfg(){ return S.exp || (S.exp = {par:'', vals:'', dur:30, sig:'', sig2:'', tgt:'', tm:0, ev:''}); }

function expParseVals(str){ str = String(str || '').trim(); const r = /^(-?[\d.]+)\s*:\s*(-?[\d.]+)\s*:\s*(-?[\d.]+)$/.exec(str);

function expMetrics(t, y, y2, tgt, tm){

// ตัวรันแบบ generator: yield ความคืบหน้า [รอบ, สัดส่วน] · คืนผล {runs:[{v, t, y, y2, m}], cfg}

function expRunSync(cfg){ EXP.stop = false; const g = expGen(cfg || expCfg()); let r; do { r = g.next(); } while (!r.done); EXP.res = r.value; return r.value; }

let EXCUR = null;
function exOpen(){ modal(`<h3>แบบฝึกหัด</h3><p class="anhint">เลือกโจทย์ → แอปจะเปิดวงจรเริ่มต้นให้ ต่อวงจรให้ครบแล้วกด "ตรวจคำตอบ" (ตรวจจากผลจำลองจริง)</p>

  <div class="row"><button class="btn" data-m="close">ปิด</button></div>`); }
function exDone(id, set){ try { const k = 'circuit-lab-ex', o = JSON.parse(localStorage.getItem(k) || '{}'); if (set){ o[id] = 1; localStorage.setItem(k, JSON.stringify(o)); } return !!o[id]; } catch (e){ return false; } }
function exStart(id, sol){ const e = EXER.find(x => x.id === id); if (!e) return; EXCUR = e; $('#modal').hidden = true;
  if (cur !== null) pushHist(); fut = []; simT = 0; load(sol ? e.sol() : e.start()); cur = ser(); save(); fit(); refreshUI(); exCard(); }

function renderPalette(){

  else if (el.dataset.num && SPF.has(k) && el.value.trim() === ''){ delete c[k]; el.style.borderColor = ''; }
  else if (el.dataset.num){ const v = parseSI(el.value);
    const bad = !isFinite(v) || (POS.has(k) && v <= 0) || ((k === 'pf' || k === 'eff') && v > 1) || (k === 'lvl' && (v < 0 || v > 100));
    el.style.borderColor = bad ? 'var(--bad)' : ''; if (bad) return; c[k] = v; }
  else if (el.tagName === 'SELECT') c[k] = typeof T[c.t].d[k] === 'number' ? +el.value : el.value;
  else c[k] = el.value;
  if (c.t === 'plc') delete c._cp;
  const md = modelOf(c); if (md && md.p && k in md.p) c.model = '';   // แก้ค่าพิกัด → กลายเป็น "กำหนดเอง"
  needSolve = true;
});
$('#ihead').addEventListener('change', e => {
  if (e.target.dataset.vshow && sel && sel.k === 'c'){ if (e.target.value) sel.c.vshow = e.target.value; else delete sel.c.vshow; commit(); return; }
  if (e.target.dataset.model && sel && sel.k === 'c'){ applyModel(sel.c, e.target.value); delete sel.c._cp; needSolve = true; commit(); return; }
  if (e.target.dataset.k) commit();
});
$('#ihead').addEventListener('keydown', e => { if (e.target.id === 'tin' && e.key === 'Enter' && sel && sel.k === 'c' && e.target.value){ termSend(sel.c, e.target.value); e.target.value = ''; } });
$('#ihead').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !sel || sel.k !== 'c') return;
  const c = sel.c;
  switch (b.dataset.act){
    case 'reset': c._trip = false; c._h = 0; if (c.t === 'rcd') c.on = true; needSolve = true; renderInsp(); break;
    case 'test': c.on = false; c._trip = 'rcd'; needSolve = true; renderInsp(); break;
    case 'kwh': c._kwh = 0; break;
    case 'vfwd': c._kp = 1; break;
    case 'vrev': c._kp = -1; break;
    case 'vstop': c._kp = 0; break;
    case 'vreset': c._rst = true; renderInsp(); break;
    case 'scope': scopeOpen(c); break;
    case 'replace': c._blown = false; c._burnt = false; c._on = false; c._h = 0; c._heat = 0; c._stress = 0; needSolve = true; renderInsp(); break;
    case 'prog': ladPid = c.id; ladOpen = true; ladSel = {ri:0, row:0, col:0}; ladStruct(); break;
    case 'mreset': delete c._vm; needSolve = true; break;
    case 'tsend': { const i = $('#tin'); if (i && i.value){ termSend(c, i.value); i.value = ''; i.focus(); } } break;
    case 'tclr': c._log = ''; break;
    case 'rot': rotate(); break;
    case 'del': delSel(); break;
  }
});
$('#bSel').onclick = () => setTool('sel');
$('#bWire').onclick = () => setTool('wire');
$('#bRot').onclick = rotate;
$('#bDel').onclick = delMulti;
$('#bBox').onclick = () => setTool(tool === 'box' ? 'sel' : 'box');
$('#bProbe').onclick = () => { if (tool === 'probe'){ setTool('sel'); PROBE.a = PROBE.b = null; } else { setTool('probe'); toast('แตะจุดวัด + (แดง) แล้วจุด COM (ดำ)'); } };
$('#ihead').addEventListener('click', e => { const b = e.target.closest('[data-ma]'); if (!b) return; const a = b.dataset.ma; if (a === 'copy') copySel(); if (a === 'dup') dupSel(); if (a === 'del') delMulti(); });
$('#bUndo').onclick = undo;
$('#bFit').onclick = fit;
$('#bLad').onclick = () => { ladOpen = !ladOpen; ladStruct(); setTimeout(resize, 200); };
$('#ftools').onclick = e => { const b = e.target.closest('[data-px]'); if (b) $('#' + b.dataset.px).click(); };
$('#bPal').onclick = () => drawer($('#main').classList.contains('palopen') ? null : 'pal');
$('#bInsp').onclick = () => drawer($('#main').classList.contains('inspopen') ? null : 'insp');
document.addEventListener('click', e => { const b = e.target.closest('[data-dclose]'); if (b) drawer(null); });
$('#bAn').onclick = () => { const w = $('#anwin'); if (w.hidden) anOpen(); else w.hidden = true; };
$('#bVal').onclick = e => { const m = $('#vmenu'); if (!m.hidden){ m.hidden = true; return; } const r = e.currentTarget.getBoundingClientRect();
  m.querySelectorAll('[data-d]').forEach(x => x.checked = x.dataset.d === 'on' ? showVal : !!DISP[x.dataset.d]);
  m.style.left = Math.max(6, Math.min(innerWidth - 290, r.right - 280)) + 'px'; m.style.top = (r.bottom + 4) + 'px'; m.hidden = false; };
$('#vmenu').onchange = e => { const k = e.target.dataset.d; if (!k) return; if (k === 'on') showVal = e.target.checked; else { DISP[k] = e.target.checked; if (e.target.checked) showVal = true; }
  $('#vmenu').querySelector('[data-d=on]').checked = showVal; dispSave(); refreshUI(); };
document.addEventListener('pointerdown', e => { const m = $('#vmenu'); if (!m.hidden && !e.target.closest('#vmenu,#bVal')) m.hidden = true; });
$('#bTheme').onclick = () => {
  const r = document.documentElement, t = r.dataset.theme;
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('circuit-theme', r.dataset.theme); } catch (e) {}
  readColors();
};
$('#ex').innerHTML = '<option value="">— เปิดตัวอย่าง —</option>' + Object.entries(EX).map(([k, v]) => `<option value="${k}">${v.nm}</option>`).join('');
$('#ex').onchange = e => { if (e.target.value) loadEx(e.target.value); e.target.value = ''; };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new ResizeObserver(resize).observe(cv);

let last = performance.now(), lastUI = 0, running = true;
function setRunning(on){
  running = on; const b = $('#bRun');
  b.textContent = on ? '■ หยุด' : '▶ รัน'; b.classList.toggle('stopped', !on);
  b.title = on ? 'หยุดการจำลอง (Space)' : 'รันการจำลอง (Space)';
}
$('#bRun').onclick = () => setRunning(!running);
function frame(now){
  const sp = running ? +$('#spd').value : 0, dt = Math.min(0.1, Math.max(0, (now - last)/1000)); last = now;
  if (sp > 0){ let t = dt*sp; while (t > 1e-6){ const h = Math.min(0.05, t); step(h); t -= h; } } else settle();
  draw(now); fxDraw();
  if (now - lastUI > 200){ lastUI = now; scopeRefresh(); liveUI(); if (ladOpen) ladMon(); fxHud(); if (scopeWin) scopeLive(); }
  requestAnimationFrame(frame);
}

window.__sim = {
  get S(){ return S; }, get RES(){ return RES; }, EX, FXS, setView, flit, spRun, spNetlist, spBuild, AN, anOpen, anRun,
  scope: n => { const c = S.comps.find(x => x.n === n); scopeRefresh(); return c && c._cap; }, scopeArm: n => scopeArm(S.comps.find(x => x.n === n)), scopeCursor: n => scopeCursorVals(S.comps.find(x => x.n === n)), scopeAutoset: n => scopeAutoset(S.comps.find(x => x.n === n)),
  load: x => (typeof x === 'string' && EX[x]) ? loadEx(x) : (load(x), cur = ser(), refreshUI()),
  solveNow: () => { needSolve = true; settle(); }, poke, step,
  run: (sec, dt = 0.05) => { for (let t = 0; t < sec - 1e-9; t += dt) step(dt); },
  find: n => S.comps.find(c => c.n === n),
  codeLint, edTokens,
  trend: () => ({t:TRD.t, v:TRD.v, sig:trendSigs()}), sigVal, trendCSV, trendOpen, expRunSync, expMetrics, expCSV, expOpen, reportHTML,
};

/* ---------- แอปบนโทรศัพท์ (PWA): manifest + service worker + ปุ่มติดตั้ง ----------
   ทำงานเมื่อเปิดผ่าน http(s) จากเว็บโฮสต์ของตัวเอง (เช่น GitHub Pages) — ใน file:// หรือหน้าแสดงตัวอย่างของ claude.ai ข้ามทั้งหมด */
let PWA_EV = null;
const pwaHost = () => /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
const pwaStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pwaIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const pwaCanInstall = () => pwaHost() && !pwaStandalone() && (!!PWA_EV || pwaIOS());
function pwaRefresh(){ const b = $('#finstall'); if (b) b.hidden = !pwaCanInstall(); }
async function pwaInstall(){
  if (PWA_EV){ PWA_EV.prompt(); try { const r = await PWA_EV.userChoice; toast(r.outcome === 'accepted' ? 'ติดตั้งแล้ว — เปิดจากไอคอน Circuit Lab บนหน้าจอ' : 'ยกเลิกการติดตั้ง'); } catch (e){} PWA_EV = null; pwaRefresh(); return; }
  if (pwaIOS()) modal(`<h3>ติดตั้งบน iPhone / iPad</h3><ol style="line-height:1.9;padding-left:20px"><li>เปิดหน้านี้ใน <b>Safari</b></li><li>แตะปุ่ม <b>แชร์</b> (สี่เหลี่ยมมีลูกศรขึ้น)</li><li>เลือก <b>เพิ่มไปยังหน้าจอโฮม</b> แล้วแตะ <b>เพิ่ม</b></li></ol><div class="row"><button class="btn on" data-m="close">เข้าใจแล้ว</button></div>`);
  else toast('ใช้เมนูของเบราว์เซอร์ → "ติดตั้งแอป" หรือ "เพิ่มลงในหน้าจอหลัก"');
}
(function pwaInit(){
  if (!pwaHost()) return;
  const add = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; Object.assign(l, extra || {}); document.head.appendChild(l); };
  add('manifest', 'circuit-lab.webmanifest'); add('apple-touch-icon', 'icons/circuit-lab-apple-180.png'); add('icon', 'icons/circuit-lab-192.png', {type:'image/png'});
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('circuit-lab-sw.js').catch(() => {}));
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA_EV = e; pwaRefresh(); });
  window.addEventListener('appinstalled', () => { PWA_EV = null; pwaRefresh(); toast('ติดตั้งแอปแล้ว'); });
  pwaRefresh();
})();
(function init(){
  try { const t = localStorage.getItem('circuit-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  readColors(); resize(); buildPalette(); setTool('sel'); setRunning(true);
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  let ok = false;
  if (saved){ try { load(JSON.parse(saved)); cur = saved; ok = true; } catch (e) {} }
  if (!ok){ load(EX.dol.f()); cur = ser(); }
  fit(); refreshUI();
  requestAnimationFrame(frame);
})();
</script>
